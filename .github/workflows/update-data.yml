name: Kemas kini data

on:
  schedule:
    # Setiap jam, minit ke-17 (UTC). Waktu Malaysia = UTC+8.
    - cron: '17 * * * *'
  workflow_dispatch: {}
  push:
    paths:
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tarik data dari Google Sheets
        run: node scripts/build-data.mjs
      - name: Simpan jika berubah
        run: |
          git config user.name "kliki-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json data/dashboard.js
          if git diff --cached --quiet; then
            echo "Tiada perubahan data."
          else
            git commit -m "Kemas kini data $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M')"
            git push
          fi
