<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLIKI Marketing Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Navigasi">
    <div class="side-brand">
      <span class="mark" aria-hidden="true">K</span>
      <div class="side-name"><strong>KLIKI</strong><span data-i18n="brandSub"></span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>

  <div class="main">
    <header class="head">
      <div class="head-title">
        <h1 data-i18n="pageTitle"></h1>
        <p id="meta" class="meta">…</p>
      </div>
      <div class="head-actions">
        <div class="select">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <label for="month" class="sr" data-i18n="month"></label>
          <select id="month"></select>
        </div>
        <div class="seg" role="group" aria-label="Bahasa / Language">
          <button type="button" id="lang-ms" data-lang="ms">BM</button>
          <button type="button" id="lang-en" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="alert" id="alert" hidden>
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>
        <div><strong id="alert-title"></strong><ul id="alert-list"></ul></div>
      </div>

      <section id="sec-overview" class="sec">
        <div class="kpi-grid">
          <article class="card kpi" id="kpi-lead"></article>
          <article class="card kpi" id="kpi-walkin"></article>
        </div>
      </section>

      <section id="sec-category" class="sec">
        <div class="sec-head"><h2 data-i18n="secCategory"></h2><p data-i18n="secCategoryHint"></p></div>
        <div class="cat-grid" id="cat-grid"></div>
      </section>

      <section id="sec-trend" class="sec">
        <div class="sec-head"><h2 data-i18n="secTrend"></h2><p data-i18n="secTrendHint"></p></div>
        <div class="trend-grid">
          <article class="card chart-card"><div class="card-head"><h3 data-i18n="trendLeadWalk"></h3><div class="legend" id="lg-lw"></div></div><div class="chart" id="ch-lw"></div></article>
          <article class="card chart-card"><div class="card-head"><h3 data-i18n="trendReach"></h3><div class="legend" id="lg-rc"></div></div><div class="chart" id="ch-rc"></div></article>
        </div>
      </section>

      <section id="sec-platform" class="sec">
        <div class="sec-head"><h2 data-i18n="secPlatform"></h2><p data-i18n="secPlatformHint"></p></div>
        <div class="plat-grid" id="plat-grid"></div>
      </section>

      <section id="sec-content" class="sec">
        <div class="sec-head"><h2 data-i18n="secContent"></h2><p data-i18n="secContentHint"></p></div>
        <article class="card table-card">
          <div class="table-scroll"><table class="tbl" id="content-table"></table></div>
        </article>
      </section>

      <section id="sec-funnel" class="sec">
        <div class="sec-head"><h2 data-i18n="secFunnel"></h2><p data-i18n="secFunnelHint"></p></div>
        <div class="funnel-grid">
          <article class="card"><div class="card-head"><h3 data-i18n="stageTitle"></h3></div><div id="stages"></div></article>
          <article class="card"><div class="card-head"><h3 data-i18n="convTitle"></h3></div><div id="conv"></div><div class="hq" id="hq"></div></article>
        </div>
      </section>

      <section id="sec-summary" class="sec">
        <div class="sec-head"><h2 data-i18n="secSummary"></h2><p data-i18n="secSummaryHint"></p></div>
        <div class="sum-grid">
          <article class="card sum good"><div class="sum-head"><span class="badge-ico"><svg class="ico" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span><h3 data-i18n="highlights"></h3></div><ul id="sum-hi"></ul></article>
          <article class="card sum bad"><div class="sum-head"><span class="badge-ico"><svg class="ico" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg></span><h3 data-i18n="improve"></h3></div><ul id="sum-lo"></ul></article>
          <article class="card sum plan"><div class="sum-head"><span class="badge-ico"><svg class="ico" viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></span><h3 id="plan-title"></h3></div><ol id="sum-plan"></ol></article>
        </div>
      </section>

      <section id="sec-outlet" class="sec">
        <div class="sec-head"><h2 data-i18n="secOutlet"></h2><p data-i18n="secOutletHint"></p></div>
        <article class="card table-card"><div class="table-scroll"><table class="tbl num" id="outlet-table"></table></div></article>
      </section>

      <footer class="foot" data-i18n="footer"></footer>
    </main>
  </div>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script src="assets/app.js"></script>
</body>
</html>
